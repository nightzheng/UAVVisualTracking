[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-visual-tracking"
version = "0.1.0"
description = "Reproducible partial-visibility point tracking research baseline"
requires-python = ">=3.10"
license = {text = "MIT (original project code only)"}
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
cotracker = ["cotracker @ git+https://github.com/facebookresearch/co-tracker.git@82e02e8029753ad4ef13cf06be7f4fc5facdda4d"]

[project.scripts]
uav-track = "uav_visual_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
