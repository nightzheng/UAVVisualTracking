<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>风机人工 GT 标注</title>
<style>body{font:16px system-ui;margin:24px;background:#f5f7fa;color:#152334}main{max-width:1100px;margin:auto}canvas{width:100%;height:auto;background:#111;cursor:crosshair;touch-action:none}button,select,input,textarea{font:inherit;padding:6px;margin:4px}button{cursor:pointer}label{display:inline-block}textarea{width:95%;height:42px}section{background:white;border:1px solid #ccd6e0;padding:12px;margin:12px 0}.warn{color:#9b3a14}#message{min-height:24px}input[type=range]{width:55%}input[type=number]{width:90px}details{margin:12px}#zoom{width:400px;max-width:100%}.grid{display:flex;flex-wrap:wrap;align-items:center;gap:10px}</style>
<main><h1>风机人工 GT 标注</h1><p>只显示原始视频帧和你手工标记的位置。没有模型预测，没有插值。叶片身份不明时选择“不确定”。</p>
<section><button id="prev">上一帧 ←</button><input id="frame" type="range" min="0" max="119" value="0"><button id="next">下一帧 →</button><label>帧 <input id="frameNumber" type="number" min="0" max="119" value="0"></label><p id="time"></p><button id="representative">下一个代表帧</button><button id="dense">下一个加密帧</button><button id="play">播放原始帧 / 停止</button></section>
<canvas id="canvas" width="960" height="540"></canvas><p id="loading"></p>
<section><label>物理点 <select id="point"></select></label><p id="query"></p><details><summary>首先确认物理点定义与初始查询的对应关系</summary><p>位置名称仅为旧查询意图，未自动证明其为叶尖。查看原始帧确认材料位置；若要更换物理点，应建立新查询并重跑两种配置。参考中心是几何点，不是材料点。</p><textarea id="definition" placeholder="可复核的点定义，例如可辨认色带边缘与轮廓交点；不得用模型坐标定义"></textarea><label><input id="correspondence" type="checkbox">确认原始查询对应此物理点</label><label>定义复核人 <input id="definitionReviewer"></label><button id="confirmDefinition">保存定义复核</button></details>
<div class="grid"><label>状态 <select id="state"><option value="pending">待标注</option><option value="visible">可见</option><option value="occluded">遮挡</option><option value="out_of_frame">出画</option><option value="not_visible_unknown">不可见，原因不明</option><option value="uncertain">身份或位置不确定</option></select></label><label>不确定性 <select id="uncertainty"><option value="pending">待确认</option><option value="none">无（人工已确认）</option><option value="identity_ambiguous">材料身份不明</option><option value="low_precision">位置精度不足</option></select></label><label>X <input id="x" type="number" step="0.1"></label><label>Y <input id="y" type="number" step="0.1"></label></div>
<p>在原图上点击手工定位。放大图只放大原始像素，不显示预测。</p><canvas id="zoom" width="400" height="200"></canvas>
<div><label>标注人 <input id="annotator"></label><label>复核人 <input id="reviewer"></label></div><textarea id="note" placeholder="不确定原因、外观线索、遮挡证据；不要推测不可见坐标"></textarea><button id="saveDraft">保存本条草稿</button><button id="review">本条经人工第二次查看，标记复核完成</button><button id="clear">清空本条</button><p id="record"></p></section>
<section><button id="export">下载标注 JSON</button><button id="exportCSV">下载标注 CSV</button><label>恢复之前的 JSON <input id="import" type="file" accept=".json"></label><p id="coverage"></p><p class="warn">浏览器草稿仅保存在本机；交付前下载 JSON 并保存进标注目录。仅经人工复核且无不确定性的条目可进入评价。未完成条目不会被自动填充。</p><p id="message"></p></section></main>
<script>
const original=__ANNOTATION_DOCUMENT__;
let doc=structuredClone(original), frame=0, point=0, timer=null, image=new Image(), loaded=-1;
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d'),storageKey='uav-gt-v1-'+doc.video_sha256;
let index=new Map();function buildIndex(){index=new Map(doc.annotations.map(r=>[r.frame_index+'|'+r.point_id,r]));}
function row(){return index.get(doc.frames[frame].frame_index+'|'+doc.points[point].point_id);}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(doc));}catch(e){$('message').textContent='本机草稿存储不可用，请下载 JSON：'+e.message;}}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function redraw(){if(loaded!==frame)return;ctx.drawImage(image,0,0);for(const p of doc.points){const r=index.get(doc.frames[frame].frame_index+'|'+p.point_id);if(r.x!=null&&r.y!=null){ctx.strokeStyle=r.review_status==='reviewed'?'#15fb83':'#ffcc00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,5,0,Math.PI*2);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.fillText(p.point_id,r.x+8,r.y-8);}}}
function show(){const r=row(),p=doc.points[point];$('frame').value=frame;$('frameNumber').value=frame;$('point').value=point;$('time').textContent='原始帧号 '+r.frame_index+'；视频时间 '+r.timestamp_seconds.toFixed(6)+' 秒；'+(doc.representative_frames.includes(r.frame_index)?'代表帧 ':'')+(doc.dense_frames.includes(r.frame_index)?'加密帧':'');$('query').textContent=p.label+'；初始查询参考 '+p.initial_query_processing.join(', ')+'（不是 GT）';for(const id of ['state','uncertainty','annotator','reviewer','note'])$(id).value=r[id]||'';for(const id of ['x','y'])$(id).value=r[id]??'';$('definition').value=p.definition;$('definitionReviewer').value=p.definition_reviewer;$('correspondence').checked=p.query_correspondence_confirmed;$('record').textContent='当前记录：'+r.review_status;$('coverage').textContent='已标注草稿 '+doc.annotations.filter(r=>r.review_status==='draft').length+'；声明人工复核 '+doc.annotations.filter(r=>r.review_status==='reviewed').length+' / '+doc.annotations.length+'（最终评价仍检查点定义与不确定性）';loaded=-1;$('loading').textContent='正在加载原始帧…';const requested=frame;image=new Image();image.onload=()=>{if(requested===frame){loaded=frame;$('loading').textContent='';redraw();}};image.onerror=()=>{$('loading').textContent='原图加载失败；请确认 raw 目录与网页位于同一文件夹。';};image.src=doc.frames[frame].image;}
function draft(review=false){const r=row(),state=$('state').value,uncertainty=$('uncertainty').value,x=$('x').value===''?null:Number($('x').value),y=$('y').value===''?null:Number($('y').value);if(state==='visible'&&!(Number.isFinite(x)&&Number.isFinite(y)&&x!==null&&y!==null&&x>=0&&x<doc.resolution[0]&&y>=0&&y<doc.resolution[1]))throw Error('可见点须在原图中人工定位');if(review){const p=doc.points[point];if(!p.definition_reviewed||!p.query_correspondence_confirmed)throw Error('请先完成人工物理点定义复核');if(['pending','uncertain'].includes(state)||uncertainty!=='none'||!$('annotator').value.trim()||!$('reviewer').value.trim())throw Error('复核需要明确状态、无不确定性、标注人及复核人');}
Object.assign(r,{state,uncertainty,x:state==='visible'?x:null,y:state==='visible'?y:null,occluded:state==='occluded'?true:state==='not_visible_unknown'||state==='uncertain'||state==='pending'?null:false,out_of_frame:state==='out_of_frame'?true:state==='not_visible_unknown'||state==='uncertain'||state==='pending'?null:false,source:'human_visual',annotator:$('annotator').value.trim(),reviewer:review?$('reviewer').value.trim():'',review_status:review?'reviewed':'draft',reviewed_at_utc:review?new Date().toISOString():'',note:$('note').value});persist();show();}
function action(fn){try{fn();$('message').textContent='已保存；修改已复核条目会撤销其复核状态。';}catch(e){$('message').textContent=e.message;}}
function go(n){if(timer){clearInterval(timer);timer=null;}frame=Math.max(0,Math.min(doc.frames.length-1,n));show();}
function nextSet(values){go(values.find(f=>f>doc.frames[frame].frame_index)??values[0]);}
for(let i=0;i<doc.points.length;i++){const o=document.createElement('option');o.value=i;o.textContent=doc.points[i].label;$('point').append(o);}
try{const cached=JSON.parse(localStorage.getItem(storageKey));if(cached&&cached.video_sha256===doc.video_sha256&&cached.schema_version===1)doc=cached;}catch(e){}
buildIndex();$('prev').onclick=()=>go(frame-1);$('next').onclick=()=>go(frame+1);$('frame').oninput=e=>go(Number(e.target.value));$('frameNumber').oninput=e=>{const n=e.target.valueAsNumber;if(Number.isInteger(n))go(n);};$('frameNumber').onchange=e=>{const n=e.target.valueAsNumber;if(Number.isInteger(n))go(n);};$('point').onchange=e=>{point=Number(e.target.value);show();};$('representative').onclick=()=>nextSet(doc.representative_frames);$('dense').onclick=()=>nextSet(doc.dense_frames);
$('saveDraft').onclick=()=>action(()=>draft());$('review').onclick=()=>action(()=>draft(true));$('clear').onclick=()=>action(()=>{Object.assign(row(),{x:null,y:null,state:'pending',uncertainty:'pending',source:'unannotated',annotator:'',reviewer:'',review_status:'pending',reviewed_at_utc:'',note:'',occluded:null,out_of_frame:null});persist();show();});
$('confirmDefinition').onclick=()=>action(()=>{const p=doc.points[point];if(!$('definition').value.trim()||!$('definitionReviewer').value.trim()||!$('correspondence').checked)throw Error('需要点定义、复核人和初始查询对应确认');Object.assign(p,{definition:$('definition').value.trim(),definition_reviewer:$('definitionReviewer').value.trim(),definition_reviewed:true,query_correspondence_confirmed:true});for(const r of doc.annotations.filter(r=>r.point_id===p.point_id&&r.review_status==='reviewed')){r.review_status='draft';r.reviewer='';r.reviewed_at_utc='';}persist();show();});
canvas.onclick=e=>{if(loaded!==frame)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;$('x').value=Math.min(959,Math.max(0,x)).toFixed(1);$('y').value=Math.min(539,Math.max(0,y)).toFixed(1);$('state').value='visible';$('uncertainty').value='none';action(()=>draft());};
canvas.onmousemove=e=>{if(loaded!==frame)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height,z=$('zoom').getContext('2d');z.imageSmoothingEnabled=false;z.clearRect(0,0,400,200);z.drawImage(image,x-50,y-25,100,50,0,0,400,200);};
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;}else{timer=setInterval(()=>{frame=(frame+1)%doc.frames.length;show();},100);}};
$('export').onclick=()=>download('wind_gt_human.json',JSON.stringify(doc,null,2));$('exportCSV').onclick=()=>{const cols=Object.keys(doc.annotations[0]),escape=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('wind_gt_human.csv','\ufeff'+cols.map(escape).join(',')+'\n'+doc.annotations.map(r=>cols.map(c=>escape(r[c])).join(',')).join('\n'),'text/csv;charset=utf-8');};
$('import').onchange=async e=>{if(!e.target.files.length)return;action(()=>{});try{const incoming=JSON.parse(await e.target.files[0].text());if(incoming.video_sha256!==original.video_sha256||incoming.schema_version!==1||JSON.stringify(incoming.resolution)!==JSON.stringify(original.resolution)||JSON.stringify(incoming.frames)!==JSON.stringify(original.frames)||JSON.stringify(incoming.points.map(p=>p.point_id))!==JSON.stringify(original.points.map(p=>p.point_id)))throw Error('视频、帧时间线或物理点身份不匹配');if(incoming.annotations.length!==original.annotations.length||new Set(incoming.annotations.map(r=>r.frame_index+'|'+r.point_id)).size!==original.annotations.length)throw Error('标注数量或键重复异常');doc=incoming;buildIndex();persist();show();}catch(e){$('message').textContent='恢复失败：'+e.message;}};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')go(frame-1);if(e.key==='ArrowRight')go(frame+1);});show();
</script></html>
